{{ define "main" }}
<div class="container">
    <h1>{{ .Title }}</h1>

    <div class="posts-list">
        {{ range .Pages }}
        <article class="post-card">
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <p class="post-date">{{ .Date.Format "January 2, 2006" }}</p>
        </article>
        {{ end }}
    </div>
</div>
{{ end }}
