{{ define "main" }}
<div class="container">
    <h1>{{ .Site.Title }}</h1>

    <div class="welcome">
        <p>This is the 'remastered' version of my <a href="https://www.travelblog.org/bloggers/jack-kerouac" target="_blank" rel="noopener">original travelblog.org blog</a>, that I wrote on my travels 2006 - 2013.</p>
        <p><a href="{{ (.Site.GetPage "/trips").RelPermalink }}">View all trips →</a></p>
    </div>

    <div class="welcome content">
        {{ .Content }}
    </div>
</div>
{{ end }}
